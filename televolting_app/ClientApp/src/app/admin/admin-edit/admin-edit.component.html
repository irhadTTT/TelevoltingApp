<ng-template #editAdminModal let-modal (emittUserForEdit)="openAdminModal($event)">
    <div class="modal-header">
        <h5 class="modal-title" id="editProfileLabel">Edit Administrator</h5>
        <button type="button" class="close" (click)="modal.dismiss()" aria-label="Close">
            <span aria-hidden="true">&times;</span>
        </button>
    </div>
    <div class="modal-body">
        <form [formGroup]="editAdminForm" (ngSubmit)="onSubmit()">
            <div class="form-group row">
                <label for="name" class="col-sm-4 col-form-label">Name</label>
                <div class="col-sm-8">
                    <input type="text" class="form-control" formControlName="name" id="name">
                </div>
            </div>
            <div class="form-group row">
                <label for="password" class="col-sm-4 col-form-label">Password</label>
                <div class="col-sm-8">
                    <input type="password" class="form-control" formControlName="password" id="password">
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-danger" (click)="modal.dismiss()">Close</button>
                <button type="submit" class="btn btn-primary" [disabled]="!editAdminForm.valid">Save changes</button>
            </div>
        </form>
    </div>
</ng-template>
